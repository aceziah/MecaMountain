{% extends "core/base.html" %}

{% block title %}
{{ project.title }}
{% endblock %}

{% block content %}

<h1>{{ project.title }}</h1>

{% if project.thumbnail %}

    <img
        src="{{ project.thumbnail.url }}"
        alt="{{ project.title }}"
        width="500"
    >

{% endif %}

<p>

    {{ project.description }}

</p>

{% endblock %}
